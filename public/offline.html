<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0D0F0E">
    <title>You&#39;re offline - Kharch</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0D0F0E;
        color: #f7f6f8;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        display: grid;
        place-items: center;
      }
      main { width: min(100%, 380px); text-align: center; }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 48px;
        color: #f7f6f8;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      .mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 11px;
        background: #00D68F;
        color: #0D0F0E;
        font-size: 21px;
        font-weight: 800;
      }
      .icon {
        display: grid;
        width: 68px;
        height: 68px;
        margin: 0 auto 24px;
        place-items: center;
        border: 1px solid #34313c;
        border-radius: 22px;
        color: #00D68F;
        font-size: 30px;
      }
      h1 { margin: 0 0 12px; font-size: clamp(27px, 7vw, 34px); letter-spacing: -0.04em; }
      p { margin: 0; color: #aaa6b2; font-size: 16px; line-height: 1.55; }
      button {
        width: 100%;
        min-height: 52px;
        margin-top: 32px;
        border: 0;
        border-radius: 14px;
        background: #00D68F;
        color: #0D0F0E;
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #f7f6f8; outline-offset: 3px; }
      button:active { background: #00D68F; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-label="Kharch"><span class="mark" aria-hidden="true">&#8377;</span>Kharch</div>
      <div class="icon" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 9.5C8.4 4.8 15.6 4.8 21 9.5M6.5 13C9.7 10.2 14.3 10.2 17.5 13M10 16.5C11.2 15.5 12.8 15.5 14 16.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M4 20 20 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>You&#39;re offline</h1>
      <p>Turn on your internet connection to continue.</p>
      <button type="button" onclick="window.location.assign(retryUrl)">Refresh</button>
    </main>
    <script>
      const encodedRetryUrl = "__KHARCH_RETRY_URL__";
      const retryUrl = encodedRetryUrl === "__KHARCH_RETRY_URL__"
        ? "/"
        : decodeURIComponent(encodedRetryUrl);
    </script>
  </body>
</html>
